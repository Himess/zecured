[package]
name = "zecured-deposit-witness"
description = "Tier 2: Zcash chain data for trust-minimized deposit proofs (ZIP 221 history tree, ZIP 244 commitments)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
zecured-zcash-ops = { path = "../zcash-ops" }
# The statement the zkVM guest proves (tier2/ workspace); checked natively here.
zecured-deposit-statement = { path = "../../../tier2/statement" }
zcash_keys.workspace = true
zcash_note_encryption.workspace = true
zcash_history = "0.6"
primitive-types = { version = "0.12", default-features = false }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
orchard.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zcash_client_backend.workspace = true
incrementalmerkletree.workspace = true
blake2b_simd.workspace = true
sha2 = "0.10"
anyhow.workspace = true
hex.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
rand_core_06.workspace = true

[[bin]]
name = "history-root"
path = "src/bin/history_root.rs"

[[bin]]
name = "dump-tx"
path = "src/bin/dump_tx.rs"

[[bin]]
name = "build-witness"
path = "src/bin/build_witness.rs"
