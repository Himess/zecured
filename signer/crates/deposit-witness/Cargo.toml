[package]
name = "zecured-deposit-witness"
description = "Tier 2: Zcash chain data for trust-minimized deposit proofs (ZIP 221 history tree, ZIP 244 commitments)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
zecured-zcash-ops = { path = "../zcash-ops" }
# The statement the zkVM guest proves (tier2/ workspace); checked natively here.
zecured-deposit-statement = { path = "../../../tier2/statement" }
# Zecured Swap's payment statement (tier2/ workspace); checked natively here.
zecured-payment-statement = { path = "../../../tier2/payment-statement" }
zcash_keys.workspace = true
zcash_note_encryption.workspace = true
zcash_history = "0.6"
primitive-types = { version = "0.12", default-features = false }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
orchard.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zcash_client_backend.workspace = true
incrementalmerkletree.workspace = true
blake2b_simd.workspace = true
sha2 = "0.10"
# The reference Equihash check (Zebra's), to label the relay's differential corpus.
equihash = "0.3"
anyhow.workspace = true
# Debug-level details that must stay out of errors a payer logs next to its order (W-10).
tracing.workspace = true
hex.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
rand_core_06.workspace = true

[[bin]]
name = "history-root"
path = "src/bin/history_root.rs"

[[bin]]
name = "build-violation"
path = "src/bin/build_violation.rs"

[[bin]]
name = "dump-tx"
path = "src/bin/dump_tx.rs"

[[bin]]
name = "build-witness"
path = "src/bin/build_witness.rs"

[[bin]]
name = "build-payment-witness"
path = "src/bin/build_payment_witness.rs"

[[bin]]
name = "update-headers"
path = "src/bin/update_headers.rs"

[[bin]]
name = "equihash-corpus"
path = "src/bin/equihash_corpus.rs"

# MOCK, TEST ONLY: the zkVM host's image-id and mock-seal where RISC Zero does not run (local fork).
[[bin]]
name = "mock-host"
path = "src/bin/mock_host.rs"
