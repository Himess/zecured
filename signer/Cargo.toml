[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
# --- Zcash (pre-release wave: the first with NU7 active on testnet at 4465026,
#     branch ID 0x77190AD9, without zcash_unstable flags). See docs/ref/FACTS.md.
orchard = { version = "0.16", features = ["unstable-frost"] }
zcash_protocol = "=0.11.0-pre.0"
zcash_primitives = "=0.31.0-pre.1"
zcash_keys = { version = "=0.17.0-pre.1", features = ["orchard", "unstable-frost"] }
zcash_address = "=0.14.0-pre.1"
zcash_client_backend = { version = "=0.25.0-pre.1", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"] }
pczt = { version = "=0.10.0-pre.1", default-features = false, features = ["std", "orchard", "io-finalizer", "prover", "signer", "tx-extractor"] }
zip321 = "=0.10.0-pre.1"
pasta_curves = "0.6"
# --- FROST: reddsa 0.6 dropped its `frost` feature (moving to ZcashFoundation/frost,
#     not yet released), so FROST(Pallas, BLAKE2b-512) comes from reddsa 0.5.2.
#     It uses pasta_curves 0.5; we bridge to orchard 0.16 types through bytes.
reddsa = { version = "0.5.2", features = ["frost", "serde"] }
# --- misc
anyhow = "1"
blake2b_simd = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
rand_010 = { package = "rand", version = "0.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots"] }
