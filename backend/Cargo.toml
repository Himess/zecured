[package]
name = "zecured-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# TEST ONLY: honour the coordinator's `test-withhold-next-broadcast` flag file
# (docs/TESTING.md). Never enable it in a demo or production build.
test-hooks = ["zecured-coordinator/test-hooks"]

[dependencies]
zecured-coordinator = { path = "../signer/crates/coordinator" }
zecured-node = { path = "../signer/crates/node" }
alloy.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
clap.workspace = true
reqwest.workspace = true
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
# Already in the lockfile (axum depends on it); used to drive routers in tests.
tower = { version = "0.5", features = ["util"] }
