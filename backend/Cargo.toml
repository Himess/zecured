[package]
name = "zecured-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# TEST ONLY: honour the coordinator's `test-withhold-next-broadcast` flag file
# (docs/TESTING.md). Never enable it in a demo or production build.
test-hooks = ["zecured-coordinator/test-hooks"]
# DEMO ONLY: the separate theft demo (review T3-6, docs/TIER3.md § 8): three compromisable nodes
# and POST /admin/vaults/:id/steal. Refuses to start against the judge deployment.
demo-tier3 = ["zecured-coordinator/demo-tier3"]

[dependencies]
zecured-coordinator = { path = "../signer/crates/coordinator" }
zecured-base = { path = "../signer/crates/base-client" }
zecured-node = { path = "../signer/crates/node" }
# P-1: the demo wallet's Ironwood payments (DEMO, the judge deployment only).
zecured-zcash-ops = { path = "../signer/crates/zcash-ops" }
orchard.workspace = true
pczt.workspace = true
zcash_protocol.workspace = true
rand_010.workspace = true
# P-1: the demo payment's stamp (already in the lock file, through zecured-base).
sha2 = "0.10"
alloy.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
clap.workspace = true
reqwest.workspace = true
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
# Already in the lockfile (axum depends on it); used to drive routers in tests.
tower = { version = "0.5", features = ["util"] }
