# Reproducible build of the two RISC Zero guests (review E4, docs/TIER2.md § 8.1). The Registry
# and the slasher pin the image ids this job prints, and every prover runs the ELFs it exports
# (ZECURED_DEPOSIT_ELF, ZECURED_VIOLATION_ELF). Anyone with Docker gets the same ids with the
# commands in README.md ("Reproducing the guest image ids").
name: guests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tier2/statement/**"
      - "tier2/methods/**"
      - "tier2/vendor/**"
      - ".github/workflows/guests.yml"

permissions:
  contents: read

jobs:
  guests:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      # risc0-build asks rzup for the guest toolchain's version even when Docker builds the guests
      # (it picks a rustc flag by version); the guests themselves are compiled inside the image.
      - name: rzup and the risc0 Rust toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSfL https://risczero.com/install | bash
          "$HOME/.risc0/bin/rzup" install rust 1.97.0

      - name: Host with both guests built in RISC Zero's guest-builder image
        working-directory: tier2
        env:
          ZECURED_DOCKER_GUESTS: "1"
        run: cargo build --release --locked -p zecured-tier2-host

      - name: Image ids and the ELFs to pin
        working-directory: tier2
        run: |
          host=target/release/zecured-tier2-host
          mkdir -p ../guests
          $host export-elf ../guests/deposit.bin
          $host violation export-elf ../guests/violation.bin
          {
            echo "deposit   $($host image-id)"
            echo "violation $($host violation image-id)"
            (cd ../guests && sha256sum deposit.bin violation.bin)
          } | tee ../guests/image-ids.txt
          {
            echo '### Guest image ids (reproducible build)'
            echo '```'
            cat ../guests/image-ids.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The Docker-built guests must behave exactly as the native statement: every single change of
      # the TEST-ONLY deposit witness (K4) and of the F1 witness gives the same outcome in both.
      - name: Parity of the pinned guests with the native statement
        working-directory: tier2
        run: |
          host=target/release/zecured-tier2-host
          $host parity statement/tests/fixtures/TEST-ONLY_vault9_witness.json
          $host violation parity statement/tests/fixtures/TEST-ONLY_vault9_f1_witness.json

      - uses: actions/upload-artifact@v4
        with:
          name: guests-${{ github.sha }}
          path: guests/
          if-no-files-found: error
