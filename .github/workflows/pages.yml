# Publishes the showcase page to GitHub Pages: everything in site/ except its tests (docs/SITE.md, "Publishing").
# Only by hand, and only when the project owner decides to: Pages has to be turned on first in the repository's
# settings, with GitHub Actions as its source, and on GitHub Free that needs a public repository.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: The page's files, without its tests
        run: |
          mkdir _site
          cp -R site/. _site/
          rm -rf _site/tests
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
