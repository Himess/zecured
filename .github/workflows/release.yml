# Prebuilt command-line tools for judges and claimants (review RQ-11): `zecured-wallet` (an
# Ironwood wallet, loans, the Tier 3 watcher) and `build-violation` (violation witnesses), for
# Linux x86_64 and macOS arm64. Runs on a version tag, and on demand.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tools:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Build
        run: |
          cargo build --release --locked -p zecured-wallet --bin zecured-wallet
          cargo build --release --locked -p zecured-deposit-witness --bin build-violation

      - name: Package
        run: |
          mkdir dist
          name="zecured-tools-${{ matrix.target }}"
          tar -C target/release -czf "dist/$name.tar.gz" zecured-wallet build-violation
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: zecured-tools-${{ matrix.target }}
          path: dist/

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Zecured $GITHUB_REF_NAME (testnet only)." || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
