[package]
name = "zecured-swap"
description = "Zecured Swap, shared by the maker bot and the CLI: ZecuredSwap's ABI and EIP-712 quote, order ids, the payment (one Ironwood note with the swap memo, ovk = None) and its proof"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zecured-zcash-ops = { path = "../../signer/crates/zcash-ops" }
zecured-deposit-witness = { path = "../../signer/crates/deposit-witness" }
