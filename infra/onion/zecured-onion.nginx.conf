# The onion service's site: the app's onion build (zecured-app-onion, 127.0.0.1:3001) at /, the backend
# (127.0.0.1:8080) at /api/. Tor connects from 127.0.0.1, so no visitor's address ever reaches nginx, and
# access logs are off all the same. Install as /etc/nginx/sites-enabled/zecured-onion.
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        # Opening a vault runs a DKG (up to 2 minutes); the sweep demo proves a PCZT (up to 4).
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
    }
}
