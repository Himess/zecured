[package]
name = "zecured-tier2-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
zecured-tier2-methods = { path = "../methods" }
zecured-deposit-statement = { path = "../statement" }
zecured-deposit-k4 = { path = "../k4" }
risc0-zkvm = "=3.0.6"
anyhow = "1"
bincode = "1"
hex = "0.4"
sha2 = "0.10"
serde_json = "1"

[features]
# Proves on an NVIDIA GPU (needs the CUDA toolkit to build), and wraps in Groth16 natively through the
# `risc0-groth16` rzup component instead of Docker (docs/TIER2.md § 8).
cuda = ["risc0-zkvm/cuda"]
