# Tier 2: trust-minimized deposit proofs (docs/TIER2.md) and Zecured Swap's payment proofs, RISC Zero zkVM.
# A separate workspace so the main build never compiles the zkVM crates. Each guest (methods/guest,
# methods/violation, methods/payment) has its own workspace and is built by risc0-build for the
# zkVM target.
[workspace]
resolver = "2"
members = ["host", "methods", "k4", "payment-statement", "payment-k4"]

[workspace.package]
edition = "2024"
license = "MIT"

# The zkVM host and the guest are unusably slow without optimization.
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true
