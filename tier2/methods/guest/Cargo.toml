[package]
name = "deposit"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }
orchard = { version = "0.16", default-features = false, features = ["std"] }
zcash_primitives = { version = "=0.31.0-pre.1", default-features = false }
zcash_protocol = "=0.11.0-pre.0"
zcash_history = "0.6"
blake2b_simd = { version = "1", default-features = false }
sha2 = "0.10"

[profile.release]
lto = true

# Pallas / Vesta field arithmetic through RISC Zero's bigint2 accelerator (see the vendored
# crate's ZECURED_PATCH.md).
[patch.crates-io]
pasta_curves = { path = "../../vendor/pasta_curves" }
