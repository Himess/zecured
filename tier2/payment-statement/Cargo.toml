[package]
name = "zecured-payment-statement"
description = "Zecured Swap: the statement a payment proof proves (a shielded ZEC payment for one swap order), shared by the zkVM guest and the hosts"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Explicit versions (no workspace inheritance): the zkVM guest builds this crate in its own
# workspace. Every dependency is one the deposit statement already has, at the same version, so the
# payment guest compiles nothing the deposit guest does not.
[dependencies]
# Inclusion (ZIP 221, txid path), the networks, the deposit rule D5 and keccak256: through its
# public API only. The deposit statement itself never changes for the payment statement.
zecured-deposit-statement = { path = "../statement" }
orchard = { version = "0.16", default-features = false, features = ["std"] }
zcash_primitives = { version = "=0.31.0-pre.1", default-features = false }
zcash_protocol = "=0.11.0-pre.0"
zcash_note_encryption = "0.5"
serde = { version = "1", features = ["derive"] }

[features]
# The network is a build parameter, never a witness field (as for the deposit statement): without
# this feature the statement proves Testnet payments (NU7 epoch), with it Mainnet ones (NU6.3 and
# NU7 epochs). Each network has its own payment guest and image id (payment-test, payment-main).
mainnet = ["zecured-deposit-statement/mainnet"]

[dev-dependencies]
serde_json = "1"
# The payment K4 catalog (it depends on this crate; a cycle through dev-dependencies is allowed).
zecured-payment-k4 = { path = "../payment-k4" }
